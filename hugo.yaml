baseURL: 'https://example.org/'
languageCode: 'en-us'
title: 'The Long Detour'
theme: 
  - "github.com/D-Sketon/hugo-theme-reimu"

params:
  # Author
  author: Ian
  subtitle: If you never f*ck around, you're never gonna find out
  description: What's the worst that could happen?
  # Font
  font: 
    article:
      - Figtree
      - Atkinson Hyperlegible
  # Use FontAwesome
  icon_font: false  

  # Menu
  menu:
    - name: wandering
      url: ""
      icon: "f6ec"
    - name: the-detour
      url: "the-detour" 
      #icon: "f279"
      #icon: "f277"
      icon: "f277"
    - name: trails-blazed
      url: "trails-blazed"
      icon: "f14e"
  # Sidebar 
  sidebar: left
  #toc: false
  # Footer
  footer:
    since: 2025
  # Dark mode
  dark_mode:
    enable: false
  # Pace Progress Bar
  pace:
    enable: false

  banner: "images/banner2.webp"
  avatar: "avatar2.webp"

  internal_theme:
    light:
      --red-0: '#b91c1c'     # Deeper, richer burgundy
      --red-1: '#be185d'     # Muted magenta
      --red-2: '#ec4899'     # Soft rose
      --red-3: '#f97316'     # Burnt orange (key accent)
      --red-4: '#fdba74'     # Apricot
      --red-5: '#fef3c7'     # Pale cream
      --red-5-5: '#fffbf5'   # Barely there blush
      --red-6: '#fffbea'     # Warm, creamy white
      --color-red-6-shadow: 'rgba(185, 28, 28, 0.3)'
      --color-red-3-shadow: 'rgba(253, 115, 22, 0.2)'

      --highlight-nav: '#fdfdfd'
      --highlight-scrollbar: '#e0e0e0'
      --highlight-background: '#ffffff'
      --highlight-current-line: '#fafafa'
      --highlight-selection: '#fdfdfd'
      --highlight-foreground: '#1f2937' 
      --highlight-comment: '#6b7280'
      --highlight-red: '#b91c1c'
      --highlight-orange: '#ea580c'
      --highlight-yellow: '#ca8a04'
      --highlight-green: '#059669'
      --highlight-aqua: '#0891b2'
      --highlight-blue: '#2563eb'
      --highlight-purple: '#7c3aed'
    dark:
      --red-4: 'rgba(236, 72, 153, 0.3)'   # Soft rose glow
      --red-5: 'rgba(190, 24, 93, 0.1)'    # Deep magenta hint
      --red-5-5: 'rgba(185, 28, 28, 0.05)' # Subtle burgundy
      --red-6: 'rgba(255, 251, 234, 0.05)' # Barely there cream

      --highlight-nav: '#111827'       # Deep navy-blue
      --highlight-scrollbar: '#1f2937' # Dark gray
      --highlight-background: '#0f172a' # Deep indigo
      --highlight-current-line: '#1e293b'
      --highlight-selection: '#334155'
      --highlight-foreground: '#e2e8f0'    # Soft, cool white text
      --highlight-comment: '#94a3b8'       # Muted blue-gray
      --highlight-red: '#f97316'      # Burnt orange (more prominent)
      --highlight-orange: '#fb923c'
      --highlight-yellow: '#facc15'
      --highlight-green: '#34d399'
      --highlight-aqua: '#22d3ee'
      --highlight-blue: '#60a5fa'
      --highlight-purple: '#a78bfa'
      --red-4: 'rgba(236, 72, 153, 0.3)'   # Soft rose glow
      --red-5: 'rgba(190, 24, 93, 0.1)'    # Deep magenta hint
      --red-5-5: 'rgba(185, 28, 28, 0.05)' # Subtle burgundy
      --red-6: 'rgba(255, 251, 234, 0.05)' # Barely there cream

      --highlight-nav: '#111827'       # Deep navy-blue, warmer than pure black
      --highlight-scrollbar: '#1f2937' # Dark gray
      --highlight-background: '#0f172a' # Deep indigo - creates a cozy, intimate space
      --highlight-current-line: '#1e293b'  # Slightly lighter than background
      --highlight-selection: '#334155'     # Medium-dark gray
      --highlight-foreground: '#e2e8f0'    # Soft, cool white text
      --highlight-comment: '#94a3b8'       # Muted blue-gray
      --highlight-red: '#f97316'      # Burnt orange (more prominent in dark mode)
      --highlight-orange: '#fb923c'   # Warm orange
      --highlight-yellow: '#facc15'   # Golden yellow
      --highlight-green: '#34d399'    # Fresh green
      --highlight-aqua: '#22d3ee'     # Bright teal
      --highlight-blue: '#60a5fa'     # Cool blue
      --highlight-purple: '#a78bfa'   # Soft purple


    