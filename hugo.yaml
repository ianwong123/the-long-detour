baseURL: 'https://example.org/'
languageCode: 'en-us'
title: 'The Long Detour'
theme: 
  - "github.com/D-Sketon/hugo-theme-reimu"

params:
  # Author
  author: Ian
  subtitle: If you never f*ck around, you're never gonna find out
  description: What's the worst that could happen?
  # Font
  font: 
    article:
      - Figtree
      #- Lexend
      #- Karla

  # Use FontAwesome
  icon_font: false  

  pjax:
    enable: true

  # Menu
  menu:
    - name: todays-story
      url: ""
      icon: "f02d"
    - name: the-detour
      url: "the-detour" 
      icon: "f277"
    - name: logbook
      url: "logbook"
      icon: "f5da"
  # Sidebar 
  sidebar: left
  #toc: false
  # Footer
  footer:
    since: 2025
  # Dark mode
  dark_mode:
    enable: false
  # Pace Progress Bar
  pace:
    enable: false

  banner: "images/banner2.webp"
  avatar: "avatar2.webp"
  
  internal_theme:
    light:
      --red-0: '#a52a2a'     
      --red-1: '#b34444'     
      --red-2: '#c05a5a'     
      --red-3: '#d48a8a'     
      --red-4: '#e8b8b8'     
      --red-5: '#f5e0e0'    
      --red-5-5: '#fbf7f7'   
      --red-6: '#fefcfc'     
      --color-red-6-shadow: 'rgba(165, 42, 42, 0.25)'
      --color-red-3-shadow: 'rgba(179, 68, 68, 0.2)'

      --highlight-nav: '#faf9f8'
      --highlight-scrollbar: '#d0c0bd'
      --highlight-background: '#ffffff'
      --highlight-current-line: '#f8f5f4'
      --highlight-selection: '#e8d0ce'        
      --highlight-foreground: '#2d2526'      
      --highlight-comment: '#7a6e6c'         
      --highlight-red: '#a52a2a'             
      --highlight-orange: '#c46b4f'          
      --highlight-yellow: '#d4a574'          
      --highlight-green: '#4f7b6b'           
      --highlight-aqua: '#4a8db5'            
      --highlight-blue: '#5a7fa5'            
      --highlight-purple: '#6a4a6a'          

    dark:
      --red-4: 'rgba(232, 184, 184, 0.15)'   
      --red-5: 'rgba(179, 68, 68, 0.1)'      
      --red-5-5: 'rgba(165, 42, 42, 0.06)'   
      --red-6: 'rgba(254, 252, 252, 0.05)'   

      --highlight-nav: '#251f21'
      --highlight-scrollbar: '#3e3436'
      --highlight-background: '#151112'       
      --highlight-current-line: '#251f21'
      --highlight-selection: '#352a2c'        
      --highlight-foreground: '#f0e8e5'       
      --highlight-comment: '#a5938f'          
      --highlight-red: '#c05a5a'              
      --highlight-orange: '#d48a6f'           
      --highlight-yellow: '#d4a574'           
      --highlight-green: '#5f8b7b'
      --highlight-aqua: '#5a9dc5'             
      --highlight-blue: '#6a8fb5'
      --highlight-purple: '#8a6a8a'           